name: Microservices CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Eureka Service
        run: |
          cd eureka
          mvn clean install

      - name: Build Food Catalogue Service
        run: |
          cd foodcatalogue
          mvn clean install

      - name: Build Order Service
        run: |
          cd order
          mvn clean install 

      - name: Build Restaurant Service
        run: |
          cd restaurantlisting
          mvn clean install

      - name: Build User Service
        run: |
          cd userinfo
          mvn clean install 

            # ---------------- DOCKER LOGIN ----------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------- BUILD & PUSH IMAGES ----------------
      - name: Build & Push Eureka Image
        run: |
          docker build -t samyuktha11/eureka-service:0.0.1 ./eureka
          docker push samyuktha11/eureka-service:0.0.1

      - name: Build & Push Restaurant Image
        run: |
          docker build -t samyuktha11/restaurant-service:latest1 ./restaurantlisting
          docker push samyuktha11/restaurant-service:latest1

      - name: Build & Push Food Catalogue Image
        run: |
          docker build -t samyuktha11/food-catalogue-service:latest1 ./foodcatalogue
          docker push samyuktha11/food-catalogue-service:latest1

      - name: Build & Push Order Image
        run: |
          docker build -t samyuktha11/order-service:latest1 ./order
          docker push samyuktha11/order-service:latest1

      - name: Build & Push User Image
        run: |
          docker build -t samyuktha11/user-service:latest1 ./userinfo
          docker push samyuktha11/user-service:latest1
